function validate(el){const s=el.value.trim(),n=Number(s),min=el.getAttribute('min'),max=el.getAttribute('max'),step=el.getAttribute('step');let ok=!s||(/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)&&Number.isFinite(n)&&(min===null||n>=Number(min))&&(max===null||n<=Number(max))&&(!step||step==='any'||Math.abs((n-Number(min||0))/Number(step)-Math.round((n-Number(min||0))/Number(step)))<1e-7));el.setCustomValidity(ok?'':({ar:'أدخل رقمًا صالحًا ضمن النطاق المطلوب',en:'Enter a valid number within the allowed range',fr:'Saisissez un nombre valide dans la plage autorisée'}[document.documentElement.lang]||'Invalid number'));}
