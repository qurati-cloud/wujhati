name: Refresh eSIM catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'
permissions:
  contents: write
concurrency:
  group: esim-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate catalog
        run: |
          curl -fLsS --retry 2 --max-time 90 'https://drive.google.com/uc?export=download&id=1OEQ2jZO3ydqd3DFXLuer3fil91YqInRH' -o /tmp/airalo.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from urllib.parse import urlparse, parse_qs
          from decimal import Decimal
          from pathlib import Path
          n='{http://base.google.com/ns/1.0}'
          root=ET.parse('/tmp/airalo.xml')
          items=root.findall('.//item')
          assert len(items)>=100, 'Incomplete catalog'
          for item in items:
              link=item.find(n+'link')
              assert link is not None and link.text
              original=urlparse(link.text)
              target=parse_qs(original.query).get('u',[link.text])[0]
              parsed=urlparse(target)
              assert parsed.scheme=='https' and parsed.hostname in ('airalo.com','www.airalo.com')
              link.text=target
              price=(item.findtext(n+'sale_price') or item.findtext(n+'price')).split()
              assert len(price)==2 and price[1]=='USD' and Decimal(price[0]).is_finite() and Decimal(price[0])>=0
              assert len(item.findtext(n+'product_type').split(' > '))==6
          ET.register_namespace('g',n[1:-1])
          root.write('data/airalo.xml',encoding='utf-8',xml_declaration=True)
          PY
      - name: Save validated catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/airalo.xml
          git diff --cached --quiet || (git commit -m 'Refresh eSIM catalog' && git push)
